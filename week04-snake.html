<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1 class="page-title">Snake</h1>
  <p><a href="index.html">Back to home</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
</body>
<script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var CELL = 20;
    var snake = { x: 5, 
                  y: 5 };
    var dx = 20;
    var dy = 0;

  function drawBoard() {
    ctx.fillStyle = "#186122";
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = "#7DF527";
    ctx.fillRect(snake.x, snake.y, 20, 20);
  }

  setInterval(step, 100);
    
  function step() {
    snake.x = snake.x + dx;
    snake.y = snake.y + dy;
    drawBoard();
  }

  document.addEventListener("keydown", function(event) {
    
  if (event.key === "ArrowRight") {
    dx = 20;
    dy = 0; }
  if (event.key === "ArrowLeft") {
    dx = -20;
    dy = 0; }
    if (event.key === "ArrowUp") {
    dx = 0;
    dy = -20; }
  if (event.key === "ArrowDown") {
    dx = 0;
    dy = 20; }
    
    if (event.key === "d") {
    dx = 20;
    dy = 0; }
  if (event.key === "a") {
    dx = -20;
    dy = 0; }

    if (event.key === "w") {
    dx = 0;
    dy = -20; }
  if (event.key === "s") {
    dx = 0;
    dy = 20; }
  });

function step() {
  snake.x = snake.x + dx;
  snake.y = snake.y + dy;
 
  if (snake.x > 380) { snake.x = 0; }
  if (snake.x < 0) { snake.x = 380; }
  if (snake.y > 380) { snake.y = 0; }
  if (snake.y < 0) { snake.y = 380; }
 
  drawBoard();
}
  </script>
</html>
