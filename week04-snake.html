<!DOCTYPE html>
<html>
<head>
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Snake</h1>
  <p><a href="index.html">Back to home</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");
    var snake = { x: 20, y: 20 };
    var dx = 20;                  
    var dy = 0;                   
    var body = [];                
    var snakeLength = 4;          
    var apple = { x: 200, y: 200 };

    function drawBoard() {
      ctx.fillStyle = "#186122";
      ctx.fillRect(0, 0, 400, 400);

      ctx.fillStyle = "red";
      ctx.fillRect(apple.x, apple.y, 20, 20);

      ctx.fillStyle = "#7DF527";
      ctx.fillRect(snake.x, snake.y, 20, 20);
      
      for (var i = 0; i < body.length; i++) {
        ctx.fillRect(body[i].x, body[i].y, 20, 20);
      }
    }

    var timer = setInterval(step, 100);

    function step() {
      snake.x = snake.x + dx;
      snake.y = snake.y + dy;

      if (snake.x > 380) { snake.x = 0; }
      if (snake.x < 0) { snake.x = 380; }
      if (snake.y > 380) { snake.y = 0; }
      if (snake.y < 0) { snake.y = 380; }

      for (var i = 0; i < body.length; i++) {
    if (body[i].x === snake.x && body[i].y === snake.y) {
      clearInterval(timer);
      alert("Game over");
      return;}
      }
      
      body.push({ x: snake.x, y: snake.y });
      while (body.length > snakeLength) {
        body.shift();
      }
      if (
        snake.x < apple.x + 20 &&
        snake.x + 20 > apple.x &&
        snake.y < apple.y + 20 &&
        snake.y + 20 > apple.y
      ) {
        snakeLength = snakeLength + 1; 
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
      }
      for (var i = 0; i < body.length - 1; i++) {
        if (body[i].x === snake.x && body[i].y === snake.y) {
          snake = { x: 20, y: 20 };
          dx = 20;
          dy = 0;
          body = [];
          snakeLength = 3;
          apple = { x: 200, y: 200 };
          
          return;
        }
      }

      drawBoard();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight") {
        dx = 20;
        dy = 0;
      }
      if (event.key === "ArrowLeft") {
        dx = -20;
        dy = 0;
      }
      if (event.key === "ArrowUp") {
        dx = 0;
        dy = -20;
      }
      if (event.key === "ArrowDown") {
        dx = 0;
        dy = 20;
      }
      if (event.key === "d") {
        dx = 20;
        dy = 0;
      }
      if (event.key === "a") {
        dx = -20;
        dy = 0;
      }
      if (event.key === "w") {
        dx = 0;
        dy = -20;
      }
      if (event.key === "s") {
        dx = 0;
        dy = 20;
      }
    });
  </script>
</body>
</html>
